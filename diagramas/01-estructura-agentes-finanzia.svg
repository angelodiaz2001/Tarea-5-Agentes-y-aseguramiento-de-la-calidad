<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" width="1120" height="690" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1120" height="690" fill="#ffffff"/>

  <!-- Top: Desarrollador (humano) -->
  <rect x="330" y="16" width="460" height="58" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
  <text x="560" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Desarrollador (humano · Grupo 6)</text>
  <text x="560" y="57" text-anchor="middle" font-size="11.5" fill="#333333">Define y aprueba spec.md y plan.md · responde dudas · revisa y aprueba la PR</text>

  <!-- Arrows Human <-> Orquestador -->
  <line x1="485" y1="74" x2="485" y2="118" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="475" y="100" text-anchor="end" font-size="11" fill="#333333">solicitud + tasks.md aprobado</text>

  <line x1="635" y1="120" x2="635" y2="76" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="645" y="100" text-anchor="start" font-size="11" fill="#333333">dudas de negocio + resumen final</text>

  <!-- Orquestador -->
  <rect x="275" y="120" width="570" height="78" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="560" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">orquestador (.claude/agents/orquestador.md · sonnet)</text>
  <text x="560" y="161" text-anchor="middle" font-size="11.5" fill="#222222">Coordina tareas en secuencia o paralelo · exige Red antes que Green · no escribe código ni pruebas</text>
  <text x="560" y="179" text-anchor="middle" font-size="11" fill="#333333">Toca solo: specs/*/tasks.md · tools: Read, Grep, Glob, Edit, AskUserQuestion, Agent(8) · sin Write ni Bash</text>

  <!-- Bus Orquestador <-> Subagentes -->
  <line x1="560" y1="198" x2="560" y2="236" stroke="#333333" stroke-width="1.5"/>
  <rect x="355" y="206" width="410" height="22" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="560" y="221" text-anchor="middle" font-size="11" fill="#222222">encargo por tarea ↓  |  ↑ informe fijo (ESTADO · ARCHIVOS · EVIDENCIA)</text>

  <line x1="185" y1="236" x2="935" y2="236" stroke="#333333" stroke-width="1.5"/>
  <line x1="185" y1="236" x2="185" y2="258" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="236" x2="560" y2="258" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="935" y1="236" x2="935" y2="258" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- COLUMN 1: Backend -->
  <rect x="20" y="260" width="330" height="366" rx="6" fill="#f5f9ff" stroke="#6c8ebf" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="185" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">Backend (Python 3.13 + FastAPI)</text>

  <!-- test-backend -->
  <rect x="34" y="294" width="302" height="148" rx="5" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="242" y="302" width="84" height="18" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="284" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#5c4800">Control TDD</text>
  <text x="44" y="315" font-size="12.5" font-weight="bold" fill="#1a1a1a">test-backend · sonnet</text>
  <text x="44" y="334" font-size="11" fill="#333333">• Pruebas pytest desde criterios (fase Red)</text>
  <text x="44" y="350" font-size="11" fill="#333333">• Mide cobertura pytest-cov ≥ 80 %</text>
  <text x="44" y="368" font-size="11" font-weight="bold" fill="#1f4e79">Toca: backend/tests/** (no backend/app/**)</text>
  <text x="44" y="385" font-size="10.5" fill="#444444">tools: Read, Grep, Glob, Edit, Write, Bash</text>
  <text x="44" y="401" font-size="10.5" fill="#444444">disallowedTools: Agent, AskUserQuestion, Web*</text>
  <text x="44" y="418" font-size="10.5" fill="#555555">Recibe criterios · Devuelve tests en rojo y % cov</text>

  <!-- dev-backend -->
  <rect x="34" y="456" width="302" height="156" rx="5" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="44" y="477" font-size="12.5" font-weight="bold" fill="#1a1a1a">dev-backend · sonnet</text>
  <text x="44" y="496" font-size="11" fill="#333333">• Código mínimo en routers → analytics → schemas</text>
  <text x="44" y="512" font-size="11" fill="#333333">• Actualiza docs/api-contracts.md · ruff + pytest</text>
  <text x="44" y="530" font-size="11" font-weight="bold" fill="#1f4e79">Toca: backend/app/** y docs/api-contracts.md</text>
  <text x="44" y="547" font-size="10.5" fill="#444444">tools: Read, Grep, Glob, Edit, Write, Bash, context7</text>
  <text x="44" y="563" font-size="10.5" fill="#444444">disallowedTools: Agent, AskUserQuestion, Web*</text>
  <text x="44" y="580" font-size="10.5" fill="#555555">Prohibido: backend/tests/**, services/**, .env</text>
  <text x="44" y="597" font-size="10.5" fill="#555555">Recibe tests en rojo · Devuelve código en verde</text>

  <!-- COLUMN 2: Transversales -->
  <rect x="368" y="260" width="384" height="366" rx="6" fill="#faf7fd" stroke="#9673a6" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="560" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b3270">Transversales (Ambos: Backend + Frontend)</text>

  <!-- arquitecto -->
  <rect x="382" y="294" width="356" height="74" rx="5" fill="#ffffff" stroke="#9673a6" stroke-width="1.4"/>
  <text x="392" y="313" font-size="12" font-weight="bold" fill="#1a1a1a">arquitecto · opus (Fase 0 del plan)</text>
  <text x="392" y="330" font-size="10.8" fill="#333333">Evalúa opciones, contrato API↔UI e impacto en models.py</text>
  <text x="392" y="346" font-size="10.5" font-weight="bold" fill="#5b3270">Solo lectura · tools: Read, Grep, Glob, Web*, context7</text>
  <text x="392" y="361" font-size="10.2" fill="#444444">disallowedTools: Edit, Write, Bash, Agent, AskUserQuestion</text>

  <!-- verificador-e2e -->
  <rect x="382" y="376" width="356" height="76" rx="5" fill="#ffffff" stroke="#9673a6" stroke-width="1.4"/>
  <rect x="652" y="383" width="76" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="690" y="395" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control E2E</text>
  <text x="392" y="395" font-size="12" font-weight="bold" fill="#1a1a1a">verificador-e2e · haiku</text>
  <text x="392" y="412" font-size="10.8" fill="#333333">Levanta 8001–8003, :8000 y :5173 · temas claro/oscuro y consola</text>
  <text x="392" y="428" font-size="10.5" font-weight="bold" fill="#5b3270">No edita repo · tools: Read, Grep, Glob, Bash, playwright</text>
  <text x="392" y="443" font-size="10.2" fill="#444444">disallowedTools: Edit, Write, Agent, AskUserQuestion, Web*</text>

  <!-- revisor-calidad -->
  <rect x="382" y="460" width="356" height="76" rx="5" fill="#ffffff" stroke="#9673a6" stroke-width="1.4"/>
  <rect x="652" y="467" width="76" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="690" y="479" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control PR</text>
  <text x="392" y="479" font-size="12" font-weight="bold" fill="#1a1a1a">revisor-calidad · opus</text>
  <text x="392" y="496" font-size="10.8" fill="#333333">Revisa reglas de negocio, capas, contrato JSON, tests y WCAG</text>
  <text x="392" y="512" font-size="10.5" font-weight="bold" fill="#5b3270">Solo lectura · tools: Read, Grep, Glob, Bash (solo git diff)</text>
  <text x="392" y="527" font-size="10.2" fill="#444444">disallowedTools: Edit, Write, Agent, AskUserQuestion, Web*</text>

  <!-- auditor-convergencia -->
  <rect x="382" y="544" width="356" height="72" rx="5" fill="#ffffff" stroke="#9673a6" stroke-width="1.4"/>
  <rect x="652" y="551" width="76" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="690" y="563" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control final</text>
  <text x="392" y="563" font-size="12" font-weight="bold" fill="#1a1a1a">auditor-convergencia · sonnet</text>
  <text x="392" y="580" font-size="10.8" fill="#333333">Cruza spec, plan y api-contracts con el código implementado</text>
  <text x="392" y="596" font-size="10.5" font-weight="bold" fill="#5b3270">Toca solo: specs/*/tasks.md · tools: Read, Grep, Glob, Edit, Bash</text>
  <text x="392" y="610" font-size="10.2" fill="#444444">disallowedTools: Write, Agent, AskUserQuestion, Web*</text>

  <!-- COLUMN 3: Frontend -->
  <rect x="770" y="260" width="330" height="366" rx="6" fill="#fffaf2" stroke="#d79b00" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="935" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b00">Frontend (React 18 + Vite 6 · JS)</text>

  <!-- test-frontend -->
  <rect x="784" y="294" width="302" height="148" rx="5" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="992" y="302" width="84" height="18" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="1034" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#5c4800">Control TDD</text>
  <text x="794" y="315" font-size="12.5" font-weight="bold" fill="#1a1a1a">test-frontend · sonnet</text>
  <text x="794" y="334" font-size="11" fill="#333333">• Pruebas Vitest + RTL contra api-contracts.md</text>
  <text x="794" y="350" font-size="11" fill="#333333">• Confirma fallo Red y cobertura v8 ≥ 80 %</text>
  <text x="794" y="368" font-size="11" font-weight="bold" fill="#8a4b00">Toca: frontend/src/__tests__/** (no JSX prod)</text>
  <text x="794" y="385" font-size="10.5" fill="#444444">tools: Read, Grep, Glob, Edit, Write, Bash</text>
  <text x="794" y="401" font-size="10.5" fill="#444444">disallowedTools: Agent, AskUserQuestion, Web*</text>
  <text x="794" y="418" font-size="10.5" fill="#555555">Recibe criterios UI · Devuelve tests en rojo y % cov</text>

  <!-- dev-frontend -->
  <rect x="784" y="456" width="302" height="156" rx="5" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
  <text x="794" y="477" font-size="12.5" font-weight="bold" fill="#1a1a1a">dev-frontend · sonnet</text>
  <text x="794" y="496" font-size="11" fill="#333333">• Implementa api.js, componentes JSX y estilos CSS</text>
  <text x="794" y="512" font-size="11" fill="#333333">• Usa variables CSS (modo oscuro) · eslint + build</text>
  <text x="794" y="530" font-size="11" font-weight="bold" fill="#8a4b00">Toca: frontend/src/** salvo __tests__/**</text>
  <text x="794" y="547" font-size="10.5" fill="#444444">tools: Read, Grep, Glob, Edit, Write, Bash, context7</text>
  <text x="794" y="563" font-size="10.5" fill="#444444">disallowedTools: Agent, AskUserQuestion, Web*</text>
  <text x="794" y="580" font-size="10.5" fill="#555555">Prohibido: __tests__/**, vite.config.js, backend/**</text>
  <text x="794" y="597" font-size="10.5" fill="#555555">Recibe tests en rojo · Devuelve UI compilada en verde</text>

  <!-- Bottom note -->
  <rect x="20" y="638" width="1080" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="560" y="654" text-anchor="middle" font-size="11" fill="#222222">Regla de aislamiento: ningún subagente tiene las herramientas Agent ni AskUserQuestion (no se invocan entre sí ni hablan con el usuario; todo pasa por el orquestador).</text>
  <text x="560" y="670" text-anchor="middle" font-size="10.8" fill="#444444">Restricciones adicionales en .claude/settings.json: permissions.deny bloquea lectura/edición de .env* y edición de docker-compose.yml y services/** + hook PreToolUse por carpeta.</text>
</svg>