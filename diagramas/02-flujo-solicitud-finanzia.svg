<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d7600"/>
    </marker>
  </defs>
  <rect width="1120" height="680" fill="#ffffff"/>

  <!-- ROW 1: Diseño y planificación -->
  <!-- Step 1 -->
  <rect x="24" y="20" width="235" height="76" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
  <text x="36" y="41" font-size="12.5" font-weight="bold" fill="#1a1a1a">1. Desarrollador (humano)</text>
  <text x="36" y="59" font-size="11" fill="#333333">Crea rama feat/... y redacta spec.md</text>
  <text x="36" y="76" font-size="11" fill="#333333">con criterios de aceptación claros</text>

  <line x1="259" y1="58" x2="287" y2="58" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="289" y="20" width="245" height="76" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
  <text x="301" y="41" font-size="12.5" font-weight="bold" fill="#1a1a1a">2. arquitecto (opus)</text>
  <text x="301" y="59" font-size="11" fill="#333333">Consulta Context7, propone contrato</text>
  <text x="301" y="76" font-size="11" fill="#333333">en api-contracts.md y alerta SQL</text>

  <line x1="534" y1="58" x2="562" y2="58" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="564" y="20" width="255" height="76" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
  <rect x="742" y="27" width="68" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="776" y="39" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control</text>
  <text x="576" y="41" font-size="12.5" font-weight="bold" fill="#1a1a1a">3. Desarrollador aprueba</text>
  <text x="576" y="59" font-size="11" fill="#333333">Resuelve dudas, aprueba plan.md</text>
  <text x="576" y="76" font-size="11" fill="#333333">y tasks.md antes de tocar código</text>

  <line x1="819" y1="58" x2="847" y2="58" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 4 -->
  <rect x="849" y="20" width="247" height="76" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"/>
  <text x="861" y="41" font-size="12.5" font-weight="bold" fill="#1a1a1a">4. orquestador (sonnet)</text>
  <text x="861" y="59" font-size="11" fill="#222222">Toma cada historia de tasks.md</text>
  <text x="861" y="76" font-size="11" fill="#222222">y delega Red → Green por stack</text>

  <!-- Connector from Step 4 to Backend & Frontend rows -->
  <path d="M 972 96 L 972 122 L 80 122 L 80 324" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="206" x2="112" y2="206" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="80" y1="324" x2="112" y2="324" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="270" y="111" width="520" height="21" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="530" y="125" text-anchor="middle" font-size="10.8" fill="#222222">Por historia: primero Backend si cambia el contrato API; en paralelo [P] si el contrato ya existe</text>

  <!-- ROW 2A: Backend container -->
  <rect x="100" y="146" width="585" height="106" rx="6" fill="#f5f9ff" stroke="#6c8ebf" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="114" y="164" font-size="11.5" font-weight="bold" fill="#1f4e79">Rama Backend (backend/** + docs/api-contracts.md)</text>

  <rect x="114" y="172" width="265" height="68" rx="5" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="307" y="178" width="64" height="16" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="339" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5c4800">Control</text>
  <text x="124" y="191" font-size="12" font-weight="bold" fill="#1a1a1a">5a. test-backend (Red)</text>
  <text x="124" y="209" font-size="10.8" fill="#333333">Crea test_*.py desde spec.md</text>
  <text x="124" y="225" font-size="10.8" font-weight="bold" fill="#1f4e79">Confirma que pytest falla (Red)</text>

  <line x1="379" y1="206" x2="405" y2="206" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="407" y="172" width="264" height="68" rx="5" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="599" y="178" width="64" height="16" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="631" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5c4800">Control</text>
  <text x="417" y="191" font-size="12" font-weight="bold" fill="#1a1a1a">5b. dev-backend (Green)</text>
  <text x="417" y="209" font-size="10.8" fill="#333333">Implementa y actualiza api-contracts.md</text>
  <text x="417" y="225" font-size="10.8" font-weight="bold" fill="#1f4e79">ruff + test_architecture + pytest OK</text>

  <!-- ROW 2B: Frontend container -->
  <rect x="100" y="264" width="585" height="106" rx="6" fill="#fffaf2" stroke="#d79b00" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="114" y="282" font-size="11.5" font-weight="bold" fill="#8a4b00">Rama Frontend (frontend/src/** · JavaScript sin TypeScript)</text>

  <rect x="114" y="290" width="265" height="68" rx="5" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="307" y="296" width="64" height="16" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="339" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5c4800">Control</text>
  <text x="124" y="309" font-size="12" font-weight="bold" fill="#1a1a1a">6a. test-frontend (Red)</text>
  <text x="124" y="327" font-size="10.8" fill="#333333">Pruebas Vitest + RTL según contrato</text>
  <text x="124" y="343" font-size="10.8" font-weight="bold" fill="#8a4b00">Confirma que npm test falla (Red)</text>

  <line x1="379" y1="324" x2="405" y2="324" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="407" y="290" width="264" height="68" rx="5" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="599" y="296" width="64" height="16" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="631" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5c4800">Control</text>
  <text x="417" y="309" font-size="12" font-weight="bold" fill="#1a1a1a">6b. dev-frontend (Green)</text>
  <text x="417" y="327" font-size="10.8" fill="#333333">api.js + JSX + variables CSS (sin hex)</text>
  <text x="417" y="343" font-size="10.8" font-weight="bold" fill="#8a4b00">eslint (jsx-a11y) + vitest + build OK</text>

  <!-- BOTH 5b and 6b merge cleanly into Step 7! -->
  <path d="M 671 206 L 708 206 L 708 200 L 736 200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <path d="M 671 324 L 708 324 L 708 200" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Step 7: verificador-e2e + cobertura -->
  <rect x="738" y="150" width="358" height="98" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
  <rect x="1012" y="158" width="74" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="1049" y="170" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control E2E</text>
  <text x="750" y="171" font-size="12.5" font-weight="bold" fill="#1a1a1a">7. verificador-e2e (haiku) + Cobertura</text>
  <text x="750" y="190" font-size="10.8" fill="#333333">• Humo HTTP (:8000) y Playwright MCP (:5173)</text>
  <text x="750" y="207" font-size="10.8" fill="#333333">• Claro/oscuro, 390/1280 px, alerta si cae API</text>
  <text x="750" y="224" font-size="10.8" font-weight="bold" fill="#5b3270">• Cobertura ≥ 80 % en test-backend y test-frontend</text>

  <line x1="917" y1="248" x2="917" y2="270" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 8: revisor-calidad -->
  <rect x="738" y="272" width="358" height="98" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
  <rect x="1012" y="280" width="74" height="17" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="1049" y="292" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#5c4800">Control PR</text>
  <text x="750" y="293" font-size="12.5" font-weight="bold" fill="#1a1a1a">8. revisor-calidad (opus · solo lectura)</text>
  <text x="750" y="312" font-size="10.8" fill="#333333">• Reglas financieras (duplicados y transferencias)</text>
  <text x="750" y="329" font-size="10.8" fill="#333333">• Contrato JSON sin TS, test smells y WCAG 2.2 AA</text>
  <text x="750" y="346" font-size="10.8" font-weight="bold" fill="#5b3270">• Anota vistas para chequeo humano con axe DevTools</text>

  <!-- Connector from Step 8 down to Decision 1 -->
  <path d="M 917 370 L 917 392 L 245 392 L 245 412" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- ROW 3: Decisiones, bucles acotados y aprobación final -->
  <!-- Diamond 1 (generous width 290, height 96 so text fits comfortably!) -->
  <polygon points="245,414 390,462 245,510 100,462" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"/>
  <text x="245" y="456" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1a1a1a">¿Pruebas, cobertura ≥ 80 %</text>
  <text x="245" y="472" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1a1a1a">y revisión sin hallazgos?</text>

  <!-- Loop 1: NO back to Backend/Frontend via left rail -->
  <path d="M 100 462 L 42 462 L 42 206 L 78 206" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="72" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">no</text>

  <!-- Stop box for Loop 1 -->
  <rect x="96" y="524" width="300" height="72" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <line x1="245" y1="510" x2="245" y2="524" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="108" y="543" font-size="10.8" font-weight="bold" fill="#7a1c18">Bucle acotado: máx. 2 vueltas por historia</text>
  <text x="108" y="560" font-size="10.5" fill="#333333">Corrige dev-* o test-*. Si tras 2 vueltas sigue fallando</text>
  <text x="108" y="576" font-size="10.5" fill="#333333">o hay duda de negocio, se detiene y pregunta al humano.</text>

  <!-- Diamond 1 YES -> Step 9 -->
  <line x1="390" y1="462" x2="432" y2="462" stroke="#2d7600" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <text x="410" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d7600">sí</text>

  <!-- Step 9: auditor-convergencia -->
  <rect x="434" y="424" width="212" height="76" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
  <text x="445" y="445" font-size="12" font-weight="bold" fill="#1a1a1a">9. auditor-convergencia</text>
  <text x="445" y="463" font-size="10.6" fill="#333333">Coteja spec, plan, tasks y contrato;</text>
  <text x="445" y="479" font-size="10.6" fill="#333333">verifica services/** y .env intactos</text>

  <line x1="646" y1="462" x2="674" y2="462" stroke="#333333" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Diamond 2: ¿Converge todo? -->
  <polygon points="756,418 838,462 756,506 674,462" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"/>
  <text x="756" y="458" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1a1a1a">¿Converge</text>
  <text x="756" y="473" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1a1a1a">todo?</text>

  <!-- Loop 2: NO adds convergence tasks and returns to orquestador (right outer rail -> Step 4) -->
  <line x1="756" y1="506" x2="756" y2="524" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="770" y="519" font-size="10.8" font-weight="bold" fill="#b85450">no</text>

  <rect x="434" y="524" width="388" height="72" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="446" y="543" font-size="10.8" font-weight="bold" fill="#7a1c18">Añade tareas de Convergencia y vuelve al paso 4 (máx. 2 vueltas)</text>
  <text x="446" y="560" font-size="10.5" fill="#333333">Si una vuelta repite las mismas brechas sin avance, el orquestador</text>
  <text x="446" y="576" font-size="10.5" fill="#333333">se detiene de inmediato y pide decisión al Desarrollador.</text>
  <!-- Explicit dashed return path from convergence box back up to Step 4! -->
  <path d="M 822 560 L 1108 560 L 1108 58 L 1098 58" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>

  <!-- Diamond 2 YES -> Step 10 -->
  <line x1="838" y1="462" x2="872" y2="462" stroke="#2d7600" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <text x="855" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d7600">sí</text>

  <!-- Step 10: Desarrollador + CI -> main -->
  <rect x="874" y="408" width="222" height="136" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="885" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">10. Desarrollador + CI → main</text>
  <text x="885" y="446" font-size="10.5" fill="#222222">1) /mutacion-backend (opc. local)</text>
  <text x="885" y="462" font-size="10.5" fill="#222222">2) /review-pr + axe DevTools</text>
  <text x="885" y="478" font-size="10.5" fill="#222222">3) Abre Pull Request hacia main</text>
  <text x="885" y="495" font-size="10.5" font-weight="bold" fill="#1e4620">4) GitHub Actions CI bloqueante</text>
  <text x="893" y="510" font-size="10" fill="#333333">(calidad-backend + calidad-frontend)</text>
  <text x="885" y="528" font-size="10.5" font-weight="bold" fill="#1e4620">5) Aprobación humana y Merge</text>

  <!-- Legend bar at bottom -->
  <rect x="24" y="618" width="1072" height="44" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <rect x="44" y="631" width="18" height="16" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
  <text x="68" y="643" font-size="11" fill="#222222">Desarrollador (humano)</text>

  <rect x="228" y="631" width="18" height="16" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="252" y="643" font-size="11" fill="#222222">Orquestador</text>

  <rect x="352" y="631" width="18" height="16" rx="3" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="376" y="643" font-size="11" fill="#222222">Subagente Backend</text>

  <rect x="518" y="631" width="18" height="16" rx="3" fill="#ffffff" stroke="#d79b00" stroke-width="1.4"/>
  <text x="542" y="643" font-size="11" fill="#222222">Subagente Frontend</text>

  <rect x="692" y="631" width="18" height="16" rx="3" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
  <text x="716" y="643" font-size="11" fill="#222222">Subagente Transversal</text>

  <rect x="880" y="631" width="44" height="16" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="902" y="643" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5c4800">Control</text>
  <text x="932" y="643" font-size="11" fill="#222222">Punto de control</text>
</svg>